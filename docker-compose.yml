services:

  db:
    image: mysql:8.0.43
    container_name: online-admission-db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: admission

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    entrypoint: ["/bin/bash", "/usr/local/bin/docker-entrypoint.sh", "mysqld"]

  app:
    build: .
    container_name: online-admission-app
    restart: unless-stopped

    depends_on:
      - db

    ports:
      - "8080:8080"

volumes:
  mysql_data: